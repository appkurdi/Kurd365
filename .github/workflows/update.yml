name: Auto Update Matches

on:
  schedule:
    - cron: '*/30 * * * *' # هەر ٣٠ خولەک جارێک کار دەکات
  workflow_dispatch: # ڕێگەت پێدەدات بە دەستیش کاری پێ بکەیت

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python script
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add live_matches.html
          git diff --quiet && git diff --staged --quiet || git commit -m "ئەپدەیتکردنەوەی خشتەی یارییەکان"
          git push
