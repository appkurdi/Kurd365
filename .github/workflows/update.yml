name: Update Live Matches

on:
  schedule:
    # کارکردن لە کاتژمێر 10ی بەیانی بە کاتی عێراق (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # ئەمە ڕێگەت پێدەدات لە گیتھەب بە دەستی خۆت کلیکی لێ بکەیت و کاری پێ بکەیت

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Python Script
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add live_matches.html
          git commit -m "ئەپدەیتکردنی یارییەکانی ئەمڕۆ لەلایەن سیستەمەوە" || echo "هیچ گۆڕانکارییەک نییە بۆ سەیڤکردن"
          git push
